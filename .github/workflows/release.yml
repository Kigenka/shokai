# Publish @kigenka/shokai to npm with provenance, from a version tag only (for example v0.3.1).
# Nothing here runs until the editor pushes such a tag to the PUBLIC repository github.com/Kigenka/shokai, and the
# `npm-publish` environment (set it to require a reviewer) approves the job. See RELEASING.md.
name: release

on:
  push:
    tags: ["v*"]
  # Run by hand on a version tag to publish under another dist-tag (for example `latest` when promoting is not wanted by hand).
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag (empty: release/release-status.json dist_tag)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Kigenka/shokai'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # OIDC: trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or later (trusted publishing)
        run: npm install -g npm@^11.5.1
      - name: The tag matches the package version
        run: |
          want="v$(node -p "require('./packages/shokai/package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME does not match package version $want"; exit 1; }
      - name: Skip a version that is already on npm (v0.3.0 was published by hand from a laptop)
        id: published
        run: |
          v="$(node -p "require('./packages/shokai/package.json').version")"
          if npm view "@kigenka/shokai@$v" version >/dev/null 2>&1; then echo "already=true" >> "$GITHUB_OUTPUT"; echo "@kigenka/shokai@$v is already published; nothing to do"; else echo "already=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install
        if: steps.published.outputs.already == 'false'
        run: npm run setup
      - name: Every suite
        if: steps.published.outputs.already == 'false'
        run: npm test
      - name: Links, versions and release status agree (release/release-status.json is the one source of truth)
        if: steps.published.outputs.already == 'false'
        run: node tools/check-links-versions.mjs
      - name: Quickstart, as written, in a fresh directory, against the committed release tarball (the bytes this job publishes)
        if: steps.published.outputs.already == 'false'
        run: SHOKAI_QUICKSTART_TGZ="release/kigenka-shokai-$(node -p "require('./packages/shokai/package.json').version").tgz" bash tools/verify-quickstart.sh
      - name: The release tarball is the one the site hosts (byte-identical; release/<name>.tgz + .sha256)
        if: steps.published.outputs.already == 'false'
        run: |
          v="$(node -p "require('./packages/shokai/package.json').version")"
          cd release && sha256sum -c "kigenka-shokai-$v.sha256"
          tar xzOf "kigenka-shokai-$v.tgz" package/package.json | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8"));if(p.private||p.version!==process.argv[1])process.exit(1)' "$v"
      - name: The release tarball runs the demo in an empty folder
        if: steps.published.outputs.already == 'false'
        run: |
          v="$(node -p "require('./packages/shokai/package.json').version")"
          mkdir "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try" && npx --yes --package="$GITHUB_WORKSPACE/release/kigenka-shokai-$v.tgz" shokai demo
      - name: Publish that exact tarball (provenance; dist-tag from the input or release/release-status.json)
        if: steps.published.outputs.already == 'false'
        env:
          DIST_TAG_INPUT: ${{ inputs.dist_tag }}
        run: |
          v="$(node -p "require('./packages/shokai/package.json').version")"
          tag="${DIST_TAG_INPUT:-$(node -p "require('./release/release-status.json').dist_tag")}"
          case "$tag" in latest|next|beta|rc) ;; *) echo "unexpected dist-tag '$tag'"; exit 1;; esac
          npm publish "release/kigenka-shokai-$v.tgz" --provenance --access public --tag "$tag"

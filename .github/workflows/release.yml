# Publish @kigenka/shokai to npm with provenance, from a version tag only (for example v0.3.1).
# Nothing here runs until the editor pushes such a tag to the PUBLIC repository github.com/Kigenka/shokai, and the
# `npm-publish` environment (set it to require a reviewer) approves the job. See RELEASING.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Kigenka/shokai'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # OIDC: trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or later (trusted publishing)
        run: npm install -g npm@^11.5.1
      - name: The tag matches the package version
        run: |
          want="v$(node -p "require('./packages/shokai/package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME does not match package version $want"; exit 1; }
      - name: Skip a version that is already on npm (v0.3.0 was published by hand from a laptop)
        id: published
        run: |
          v="$(node -p "require('./packages/shokai/package.json').version")"
          if npm view "@kigenka/shokai@$v" version >/dev/null 2>&1; then echo "already=true" >> "$GITHUB_OUTPUT"; echo "@kigenka/shokai@$v is already published; nothing to do"; else echo "already=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install
        if: steps.published.outputs.already == 'false'
        run: npm run setup
      - name: Every suite
        if: steps.published.outputs.already == 'false'
        run: npm test
      - name: Quickstart, as written, in a fresh directory
        if: steps.published.outputs.already == 'false'
        run: bash tools/verify-quickstart.sh
      - name: The packed package runs the demo in an empty folder
        if: steps.published.outputs.already == 'false'
        run: |
          cd packages/shokai && npm pack --pack-destination "$RUNNER_TEMP" && cd "$RUNNER_TEMP" && mkdir try && cd try \
            && npx --yes --package="$RUNNER_TEMP"/kigenka-shokai-*.tgz shokai demo
      - name: Publish (provenance; dist-tag from publishConfig)
        if: steps.published.outputs.already == 'false'
        working-directory: packages/shokai
        # package.json keeps "private": true in git so nothing is published by accident; only this approved job removes it.
        run: npm pkg delete private && npm publish --provenance --access public

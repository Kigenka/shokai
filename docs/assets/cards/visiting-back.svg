<svg xmlns="http://www.w3.org/2000/svg" class="skc skc-v" viewBox="0 0 340 560" role="img" aria-labelledby="skvbt skvbd"><title id="skvbt">Shōkai visitor card, back: coming home from Kettle &amp; Leaf</title><desc id="skvbd">Back of the same Shōkai visitor card. A green pass slip clipped on: admitted with a pass at Kettle &amp; Leaf for menu.view and order.place, until 15:30 (the specification's seat). Two inked visit stamps, like station stamps: Kettle &amp; Leaf, purchase, No. 007, with a teapot; Corsavel Books, visit, No. 012, with a book. A report slip: reported to Aya, 6.00 of 10.00 USD spent, one next step. On the wire: the representative's did:key, the owner binding (passkey_webauthn), the actions purchase, menu.view and order.place, may buy as proposed S1 with no amount, the VisitReport, and the wire tag shokai/0.5.</desc><style>.skc-v .surf{fill:var(--skc-surface-v,#e7edf3)}.skc-v .band{fill:var(--skc-indigo,#2c4a6c)}.skc-v .slip{fill:var(--skc-slip,#f3ecdc)}.skc-v .ink{fill:var(--skc-ink,#1f1c18)}.skc-v .ink2{fill:var(--skc-ink2,#4a443b)}.skc-v .ink3{fill:var(--skc-ink3,#6f685c)}.skc-v .ind{fill:var(--skc-indigo,#2c4a6c)}.skc-v .ver{fill:var(--skc-hanko,#b0412a)}.skc-v .tea{fill:var(--skc-tea,#4f6b3f)}.skc-v .ivr{fill:var(--skc-indigo,#2c4a6c)}.skc-v .sInk{fill:none;stroke:var(--skc-ink,#1f1c18)}.skc-v .sInk3{fill:none;stroke:var(--skc-ink3,#6f685c)}.skc-v .sInd{fill:none;stroke:var(--skc-indigo,#2c4a6c)}.skc-v .sVer{fill:none;stroke:var(--skc-hanko,#b0412a)}.skc-v .sTea{fill:none;stroke:var(--skc-tea,#4f6b3f)}.skc-v .sRule{fill:none;stroke:var(--skc-rule,#d9cfbb)}.skc-v .sFoil{fill:none;stroke-width:.9}.skc-v .dash{fill:none;stroke:var(--skc-ink3,#6f685c);stroke-width:1;stroke-dasharray:4 3}.skc-v .grainD{opacity:var(--skc-grain-d,.5)}.skc-v .grainL{opacity:var(--skc-grain-l,0)}.skc-v .fiber{fill:none;stroke:var(--skc-fiber,#c9b99a);stroke-width:.5;opacity:.55}.skc-v .serif{font-family:var(--sk-serif,"Iowan Old Style","Palatino Linotype","Noto Serif",Georgia,serif)}.skc-v .sans{font-family:var(--vp-font-family-base,ui-sans-serif,-apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif)}.skc-v .mono{font-family:var(--vp-font-family-mono,ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace)}.skc-v .eyebrow{font-size:11.5px;letter-spacing:.16em;font-weight:700}.skc-v .kindlabel{font-size:22.5px;letter-spacing:.03em;font-weight:800}</style><defs>

<svg xmlns="http://www.w3.org/2000/svg" class="skc skc-i" viewBox="0 0 340 560" role="img" aria-labelledby="skift skifd"><title id="skift">Shōkai invitation card, front: a fictional example for The Shōkai Lounge</title><desc id="skifd">The front, on soft-gold washi with a gold band, labeled Shōkai invitation card. You're invited, The Shōkai Lounge, to visit, with your agent. A short garden line. A visiting-agent panel with a fictional short address, shokaiprotocol.com/i/example, a decorative mark that is not a working code, and the agent instructions: ask first, do not invent a code. Hold, 24 hours by default. The address on this picture is not a working invitation.</desc><style>.skc-i .surf{fill:var(--skc-surface-i,#f4ecd8)}.skc-i .band{fill:var(--skc-gold,#8f7040)}.skc-i .slip{fill:var(--skc-slip,#f3ecdc)}.skc-i .ink{fill:var(--skc-ink,#1f1c18)}.skc-i .ink2{fill:var(--skc-ink2,#4a443b)}.skc-i .ink3{fill:var(--skc-ink3,#6f685c)}.skc-i .ind{fill:var(--skc-indigo,#2c4a6c)}.skc-i .ver{fill:var(--skc-hanko,#b0412a)}.skc-i .tea{fill:var(--skc-tea,#4f6b3f)}.skc-i .gold{fill:var(--skc-gold,#8f7040)}.skc-i .ivr{fill:var(--skc-indigo,#2c4a6c)}.skc-i .sInk{fill:none;stroke:var(--skc-ink,#1f1c18)}.skc-i .sInk3{fill:none;stroke:var(--skc-ink3,#6f685c)}.skc-i .sInd{fill:none;stroke:var(--skc-indigo,#2c4a6c)}.skc-i .sVer{fill:none;stroke:var(--skc-hanko,#b0412a)}.skc-i .sTea{fill:none;stroke:var(--skc-tea,#4f6b3f)}.skc-i .sGold{fill:none;stroke:var(--skc-gold,#8f7040)}.skc-i .sRule{fill:none;stroke:var(--skc-rule,#d9cfbb)}.skc-i .sFoil{fill:none;stroke-width:.9}.skc-i .dash{fill:none;stroke:var(--skc-ink3,#6f685c);stroke-width:1;stroke-dasharray:4 3}.skc-i .grainD{opacity:var(--skc-grain-d,.5)}.skc-i .grainL{opacity:var(--skc-grain-l,0)}.skc-i .fiber{fill:none;stroke:var(--skc-fiber-i,#d4c199);stroke-width:.5;opacity:.55}.skc-i .serif{font-family:var(--sk-serif,"Iowan Old Style","Palatino Linotype","Noto Serif",Georgia,serif)}.skc-i .sans{font-family:var(--vp-font-family-base,ui-sans-serif,-apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif)}.skc-i .mono{font-family:var(--vp-font-family-mono,ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace)}.skc-i .eyebrow{font-size:11.5px;letter-spacing:.16em;font-weight:700}.skc-i .kindlabel{font-size:22.5px;letter-spacing:.03em;font-weight:800}</style><defs>

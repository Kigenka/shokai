<svg xmlns="http://www.w3.org/2000/svg" class="skc skc-h" viewBox="0 0 340 560" role="img" aria-labelledby="skhft skhfd"><title id="skhft">Shōkai host card, front: Kettle &amp; Leaf, with Suzu, its host representative</title><desc id="skhfd">The front, on matcha-washed paper with a tea-green band, labeled Shōkai host card in large letters. Kettle &amp; Leaf, a small tea house; Suzu, host representative. A square vermilion seal (kakuin) with the arch carved in, inside a square frame with ticks: sealed with the place's own key. A welcome slip: unhurried, first visits welcome, ask for notes. Chips: invites guests and come visit (both dashed, proposed S8). Valid to 29 October 2027.</desc><style>.skc-h .surf{fill:var(--skc-surface-h,#e9eedd)}.skc-h .band{fill:var(--skc-tea,#4f6b3f)}.skc-h .slip{fill:var(--skc-slip,#f3ecdc)}.skc-h .ink{fill:var(--skc-ink,#1f1c18)}.skc-h .ink2{fill:var(--skc-ink2,#4a443b)}.skc-h .ink3{fill:var(--skc-ink3,#6f685c)}.skc-h .ind{fill:var(--skc-indigo,#2c4a6c)}.skc-h .ver{fill:var(--skc-hanko,#b0412a)}.skc-h .tea{fill:var(--skc-tea,#4f6b3f)}.skc-h .ivr{fill:var(--skc-indigo,#2c4a6c)}.skc-h .sInk{fill:none;stroke:var(--skc-ink,#1f1c18)}.skc-h .sInk3{fill:none;stroke:var(--skc-ink3,#6f685c)}.skc-h .sInd{fill:none;stroke:var(--skc-indigo,#2c4a6c)}.skc-h .sVer{fill:none;stroke:var(--skc-hanko,#b0412a)}.skc-h .sTea{fill:none;stroke:var(--skc-tea,#4f6b3f)}.skc-h .sRule{fill:none;stroke:var(--skc-rule,#d9cfbb)}.skc-h .sFoil{fill:none;stroke-width:.9}.skc-h .dash{fill:none;stroke:var(--skc-ink3,#6f685c);stroke-width:1;stroke-dasharray:4 3}.skc-h .grainD{opacity:var(--skc-grain-d,.5)}.skc-h .grainL{opacity:var(--skc-grain-l,0)}.skc-h .fiber{fill:none;stroke:var(--skc-fiber,#c9b99a);stroke-width:.5;opacity:.55}.skc-h .serif{font-family:var(--sk-serif,"Iowan Old Style","Palatino Linotype","Noto Serif",Georgia,serif)}.skc-h .sans{font-family:var(--vp-font-family-base,ui-sans-serif,-apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif)}.skc-h .mono{font-family:var(--vp-font-family-mono,ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace)}.skc-h .eyebrow{font-size:11.5px;letter-spacing:.16em;font-weight:700}.skc-h .kindlabel{font-size:22.5px;letter-spacing:.03em;font-weight:800}</style><defs>

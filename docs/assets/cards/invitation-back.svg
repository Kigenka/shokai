<rect x="9.5" y="9.5" width="321" height="541" rx="8" class="sFoil" stroke="url(#skibfoil)"/><g transform="translate(29 30.625) scale(0.3125)"><g class="gold"><path d="M9 53 V30 A23 23 0 0 1 23.95 8.46 L26.92 16.42 A14.5 14.5 0 0 0 17.5 30 V53 Z"/><path d="M55 53 V30 A23 23 0 0 0 40.05 8.46 L37.08 16.42 A14.5 14.5 0 0 1 46.5 30 V53 Z"/><rect x="6.5" y="52.99" width="13.5" height="3.5" rx="1"/><rect x="44.0" y="52.99" width="13.5" height="3.5" rx="1"/></g><path class="ver" d="M28.49 15.93 L25.71 4.77 A26 26 0 0 1 38.29 4.77 L35.51 15.93 A14.5 14.5 0 0 0 28.49 15.93 Z"/></g><text x="56" y="45" class="sans eyebrow gold" >SHŌKAI INVITATION CARD</text><text x="310" y="45" class="sans eyebrow ink3" text-anchor="end">INSIDE</text>
<text x="30" y="86" class="serif ink" font-size="16.5" font-weight="600">Not a fourth class on the wire.</text>
<text x="30" y="108" class="sans ink2" font-size="13">The printed or shared face of an invitation.</text>
<rect class="slip" x="30" y="122" width="280" height="86" rx="4"/><path class="sRule" d="M38 128 H302"/>
<text x="46" y="146" class="sans eyebrow gold" >WHEN REDEEMED</text>
<text x="46" y="168" class="serif ink" font-size="14.5" font-style="italic">The place signs a visitor card</text>
<text x="46" y="186" class="serif ink" font-size="14.5" font-style="italic">and a mandate. The agent carries them in.</text>
<text x="46" y="200" class="mono ink3" font-size="10.5">not printed on the face</text>
<rect class="slip" x="30" y="218" width="280" height="78" rx="4"/>
<text x="46" y="242" class="sans eyebrow gold" >AT THE DOOR</text>
<text x="46" y="264" class="serif ink" font-size="14.5" font-style="italic">One passkey tap at “Let me ask.”</text>
<text x="46" y="282" class="sans ink2" font-size="12.5">The invitation never stands in for it.</text>
<rect class="slip" x="30" y="306" width="280" height="78" rx="4"/>
<text x="46" y="330" class="sans eyebrow gold" >HOLD AND GIFT</text>
<text x="46" y="352" class="serif ink" font-size="14" font-style="italic">Hold, 24 hours by default, owner-set.</text>
<text x="46" y="370" class="serif ink" font-size="14" font-style="italic">Gift: place-owned pretend credit.</text>
<text x="46" y="384" class="mono ink3" font-size="10.5">Lounge practice</text>
<path class="sRule" d="M30 410 H310"/><text x="30" y="427" class="sans eyebrow ink3" >IN THIS INVITATION</text><text x="30" y="440" class="mono ink3" font-size="10.5">not a card kind in SPEC v0.5.0</text><text x="30" y="453.5" class="mono ink3" font-size="10.5">invitation_request · invitation_response</text><text x="30" y="467" class="mono ink3" font-size="10.5">visitor card + mandate at redemption</text><text x="30" y="480.5" class="mono ink3" font-size="10.5">hold_hours · owner-set · 24h default</text><text x="30" y="494" class="mono ink3" font-size="10.5">example · not a working code</text><text x="310" y="427" class="mono ink3" font-size="10.5" text-anchor="end">example</text></svg>

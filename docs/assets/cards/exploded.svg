<svg xmlns="http://www.w3.org/2000/svg" class="skc skc-plain" viewBox="0 0 480 768" role="img" aria-labelledby="sket sked"><title id="sket">Shōkai visitor card, taken apart: its layers and their fields</title><desc id="sked">The Shōkai visitor card taken apart, front to back: face (principal.display_name, role); the owner's context, shared as prose (mandate.purpose.statement); the mission slip, the mandate (purpose, limits); may buy yes or no, with no amount (proposed S1); the scope (mandate_scope); the representative key with its possession proof, a solid ring with ticks; the hanko, the owner's passkey signature (owner_binding); and slots for an introduction (a Vouch, section 4), a place's invitation (S8 for sending) and heard-of (S5). Proposed layers are dashed.</desc><style>.skc-plain .surf{fill:var(--skc-surface,#fbf6ea)}.skc-plain .band{fill:var(--skc-indigo,#2c4a6c)}.skc-plain .slip{fill:var(--skc-slip,#f3ecdc)}.skc-plain .ink{fill:var(--skc-ink,#1f1c18)}.skc-plain .ink2{fill:var(--skc-ink2,#4a443b)}.skc-plain .ink3{fill:var(--skc-ink3,#6f685c)}.skc-plain .ind{fill:var(--skc-indigo,#2c4a6c)}.skc-plain .ver{fill:var(--skc-hanko,#b0412a)}.skc-plain .tea{fill:var(--skc-tea,#4f6b3f)}.skc-plain .ivr{fill:var(--skc-indigo,#2c4a6c)}.skc-plain .sInk{fill:none;stroke:var(--skc-ink,#1f1c18)}.skc-plain .sInk3{fill:none;stroke:var(--skc-ink3,#6f685c)}.skc-plain .sInd{fill:none;stroke:var(--skc-indigo,#2c4a6c)}.skc-plain .sVer{fill:none;stroke:var(--skc-hanko,#b0412a)}.skc-plain .sTea{fill:none;stroke:var(--skc-tea,#4f6b3f)}.skc-plain .sRule{fill:none;stroke:var(--skc-rule,#d9cfbb)}.skc-plain .sFoil{fill:none;stroke-width:.9}.skc-plain .dash{fill:none;stroke:var(--skc-ink3,#6f685c);stroke-width:1;stroke-dasharray:4 3}.skc-plain .grainD{opacity:var(--skc-grain-d,.5)}.skc-plain .grainL{opacity:var(--skc-grain-l,0)}.skc-plain .fiber{fill:none;stroke:var(--skc-fiber,#c9b99a);stroke-width:.5;opacity:.55}.skc-plain .serif{font-family:var(--sk-serif,"Iowan Old Style","Palatino Linotype","Noto Serif",Georgia,serif)}.skc-plain .sans{font-family:var(--vp-font-family-base,ui-sans-serif,-apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif)}.skc-plain .mono{font-family:var(--vp-font-family-mono,ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace)}.skc-plain .eyebrow{font-size:11.5px;letter-spacing:.16em;font-weight:700}.skc-plain .kindlabel{font-size:22.5px;letter-spacing:.03em;font-weight:800}</style><defs>

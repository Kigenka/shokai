<svg xmlns="http://www.w3.org/2000/svg" class="skc skc-v" viewBox="0 0 340 560" role="img" aria-labelledby="skvft skvfd"><title id="skvft">Shōkai visitor card, front: Mio, representing Aya Linden</title><desc id="skvfd">The front, on indigo-washed paper with an indigo band, labeled Shōkai visitor card in large letters. Mio, representing Aya Linden. A round vermilion seal (inkan) with the arch mark carved in, inside a solid ring with ticks: sealed with Aya's passkey. A mission slip: a new green tea blend, for this afternoon. May buy: yes (dashed, proposed). Valid to 29 January 2027.</desc><style>.skc-v .surf{fill:var(--skc-surface-v,#e7edf3)}.skc-v .band{fill:var(--skc-indigo,#2c4a6c)}.skc-v .slip{fill:var(--skc-slip,#f3ecdc)}.skc-v .ink{fill:var(--skc-ink,#1f1c18)}.skc-v .ink2{fill:var(--skc-ink2,#4a443b)}.skc-v .ink3{fill:var(--skc-ink3,#6f685c)}.skc-v .ind{fill:var(--skc-indigo,#2c4a6c)}.skc-v .ver{fill:var(--skc-hanko,#b0412a)}.skc-v .tea{fill:var(--skc-tea,#4f6b3f)}.skc-v .ivr{fill:var(--skc-indigo,#2c4a6c)}.skc-v .sInk{fill:none;stroke:var(--skc-ink,#1f1c18)}.skc-v .sInk3{fill:none;stroke:var(--skc-ink3,#6f685c)}.skc-v .sInd{fill:none;stroke:var(--skc-indigo,#2c4a6c)}.skc-v .sVer{fill:none;stroke:var(--skc-hanko,#b0412a)}.skc-v .sTea{fill:none;stroke:var(--skc-tea,#4f6b3f)}.skc-v .sRule{fill:none;stroke:var(--skc-rule,#d9cfbb)}.skc-v .sFoil{fill:none;stroke-width:.9}.skc-v .dash{fill:none;stroke:var(--skc-ink3,#6f685c);stroke-width:1;stroke-dasharray:4 3}.skc-v .grainD{opacity:var(--skc-grain-d,.5)}.skc-v .grainL{opacity:var(--skc-grain-l,0)}.skc-v .fiber{fill:none;stroke:var(--skc-fiber,#c9b99a);stroke-width:.5;opacity:.55}.skc-v .serif{font-family:var(--sk-serif,"Iowan Old Style","Palatino Linotype","Noto Serif",Georgia,serif)}.skc-v .sans{font-family:var(--vp-font-family-base,ui-sans-serif,-apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif)}.skc-v .mono{font-family:var(--vp-font-family-mono,ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono"
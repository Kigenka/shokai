 rgb(74, 71, 65) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 280px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#4a4741 !important" class="nodeLabel"><p>Existing pieces may be<br />linked as hints:<br />schema.org, product feed,<br />MCP Server Card, A2A Agent Card</p></span></div></foreignObject></g></g><g class="node default shokai" id="my-svg-flowchart-D-8" data-look="classic" transform="translate(170.1796875, 734)"><rect class="basic label-container" style="fill:#2c4a6c !important;stroke:#2c4a6c !important" x="-155.125" y="-78" width="310.25" height="156"/><g class="label" style="color:#fbf9f4 !important" transform="translate(-119.125, -60)"><rect/><foreignObject width="238.25" height="120"><div style="color: rgb(251, 249, 244) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 280px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fbf9f4 !important" class="nodeLabel"><p>3. For anything personal,<br />it visits the door:<br />owner-signed visitor card,<br />an introduction only if required,<br />signed limits</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S-10" data-look="classic" transform="translate(170.1796875, 926)"><rect class="basic label-container" style="" x="-114.9140625" y="-66" width="229.828125" height="132"/><g class="label" style="" transform="translate(-78.9140625, -48)"><rect/><foreignObject width="157.828125" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 280px; text-align: center;"><span class="nodeLabel"><p>The door answers<br />grant, conditional,<br />deny, or considering,<br />and may give a pass</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color=